name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: test
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "9.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install gh-ost and percona-toolkit
        run: |
          curl -fsSL https://github.com/github/gh-ost/releases/download/v1.1.11/gh-ost-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y percona-toolkit
      - name: start the lab
        run: make lab-up MYSQL_VERSION=${{ matrix.mysql }}
      - name: integration tests
        run: make test-integration
      - name: stop the lab
        if: always()
        run: make lab-down
